<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout - Kim Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/checkout.js"></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark">KS</span>
            <span class="brand-text">Kim Shop</span>
        </a>
        <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span id="cart-count" class="cart-badge" hidden>0</span>
        </a>
    </div>
</header>
<main class="container">
    <a href="cart.html" class="back-link">← Back to cart</a>
    <h1 class="page-title">Checkout</h1>

    <div class="cart-layout">
        <form id="checkout-form" class="form-card" novalidate>
            <h2>Your details</h2>
            <div id="form-alert" class="form-alert" role="alert" hidden></div>

            <div class="field">
                <label for="customerName">Full name</label>
                <input id="customerName" name="customerName" type="text" maxlength="100" autocomplete="name">
                <p class="field-error" data-error-for="customerName" hidden></p>
            </div>

            <div class="field">
                <label for="customerEmail">Email</label>
                <input id="customerEmail" name="customerEmail" type="email" maxLength="254" autocomplete="email">
                <p class="field-error" data-error-for="customerEmail" hidden></p>
            </div>

            <button type="submit" class="btn-primary btn-block">Place order</button>
            <p class="hint">No payment needed: this is a practice shop.</p>
        </form>

        <aside class="cart-summary">
            <h2>Your Order</h2>
            <ul id="summary-items" class="summary-items"></ul>
            <div class="summary-line total"><span>Total</span><span id="summary-total">$0.00</span></div>
            <p class="hint">Final prices are confirmed by the server when you place the order.</p>
        </aside>
    </div>
</main>

<footer class="site-footer">
    <div class="container">Kim Shop · A practice project with Spring Boot and plain JavaScript</div>
</footer>
</body>
</html>
