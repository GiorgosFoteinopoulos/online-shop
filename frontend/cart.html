<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart · Kim Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css"> 
    <script type="module" src="js/cart-page.js"></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark">KS</span>
            <span class="brand-text">Kim Shop</span>
        </a>
        <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span id="cart-count" class="cart-badge" hidden>0</span>
        </a>
    </div>
</header>
<main class="container">
    <h1 class="page-title">Your cart</h1>
    <div id="cart" class="cart-layout"></div>
</main>

<footer class="site-footer">
    <div class="container">Kim Shop · a practice project with Spring Boot and plain JavaScript</div>
</footer>

<template id="cart-row">
    <li class="cart-item">
        <div class="cart-thumb"></div>
        <div class="cart-info">
            <a class="cart-name" href="#"></a>
            <span class="cart-unit"></span>
        </div>
        <div class="qty">
            <button type="button" class="qty-btn" data-action="decrease" aria-label="Decrease quantity">−</button>
            <span class="qty-value"></span>
            <button type="button" class="qty-btn" data-action="increase" aria-label="Increase quantity">+</button>
        </div>
        <span class="cart-line-total"></span>
        <button type="button" class="remove-btn" data-action="remove" aria-label="Remove item">✕</button>
    </li>
</template>

</body>
</html>
