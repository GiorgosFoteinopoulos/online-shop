<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order confirmed · Kim Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/order.js"></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark">KS</span>
            <span class="brand-text">Kim Shop</span>
        </a>
        <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span id="cart-count" class="cart-badge" hidden>0</span>
        </a>
    </div>
</header>
<main class="container narrow">
    <div id="order-view" hidden>
        <section class="order-hero">
            <div class="order-check" aria-hidden="true">✓</div>
            <h1>Thank you, <span id="order-name"></span>!</h1>
            <p>Your order <strong id="order-ref"></strong> has been placed.
            A confirmation would be sent to <strong id="order-email"></strong>.</p>
        </section>

        <section class="order-card">
            <div class="order-meta">
                <div><span class="meta-label">Status</span><span id="order-status" class="status-badge"></span></div>
                <div><span class="meta-label">Placed</span><span id="order-date"></span></div>
            </div>
            <ul id="order-items" class="order-items"></ul>
            <div class="summary-line total"><span>Total </span><span id="order-total"></span></div>
        </section>
        <a class="btn-primary" href="index.html">Continue shopping</a>
    </div>
    <div id="order-message"></div>
</main>

<footer class="site-footer">
    <div class="container">Kim Shop · a practice project with Spring Boot and plain JavaScript</div>
</footer>

<template id="order-row">
    <li class="order-row">
        <span class="order-row-name"></span>
        <span class="order-row-qty"></span>
        <span class="order-row-total"></span>
    </li>
</template>
</body>
</html>
