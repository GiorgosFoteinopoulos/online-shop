<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark">KS</span>
            <span class="brand-text">Kim Shop</span>
        </a>
        <div class="search">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                    <path d="m20 20-3.5-3.5"/>
            </svg>
            <input id="search" type="search" placeholder="Search products..." autocomplete="off" aria-label="Search products">
        </div>
                <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span id="cart-count" class="cart-badge" hidden>0</span>
        </a>
    </div>
</header>

<main class="container">
    <section class="hero">
        <h1>Everything you need. Literally.</h1>
        <p>Hand-picked electronics, books, kitchen and outdoor gear.</p>
    </section>

    <section class="toolbar">
        <div id="categories" class="chips" aria-label="Categories"></div>
        <label class="sort">
            Sort by
            <select id="sort">
                <option value="name,asc">Name (A-Z)</option>
                <option value="price,asc">Price: low to high</option>
                <option value="price,desc">Price:high to low</option>
                <option value="id,desc">Newest</option>
            </select>
        </label>
    </section>

    <p id="result-info" class="result-info"></p>
    <div id="products" class="grid" aria-live="polite"></div>
    <nav id="pagination" class="pagination" aria-label="Pages"></nav>
</main>

<footer class="site-footer">
    <div class="container">Kim Street Convenience Shop · a practice project with Spring Boot and plain JavaScript</div>
</footer>

<template id="product-card">
    <a class="card" href="#">
        <div class="card-media">
            <span class="card-emoji"></span>
            <span class="card-badge">Out of stock</span>                                                                                
        </div>
        <div class="card-body">
            <span class="card-category"></span>
            <h3 class="card-title"></h3>
            <p class="card-desc"></p>
            <div class="card-footer">
                <span class="card-price"></span>
                <span class="card-stock"></span>
            </div>
        </div>
    </a>
</template> 
</body>
