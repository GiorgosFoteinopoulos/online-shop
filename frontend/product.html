<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product · Kim Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/product.js"></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark">KS</span>
            <span class="brand-text">Kim Shop</span>
        </a>
        <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span id="cart-count" class="cart-badge" hidden>0</span>
        </a>
    </div>
</header>

<main class="container">
    <a href="index.html" class="back-link">← Back to products</a>
    <div id="product" aria-live="polite"></div>
</main>

<footer class="site-footer">
    <div class="container">Kim Shop · a practice project with Spring Boot and plain JavaScript</div>
</footer>

<template id="product-detail">
    <div class="product-detail">
        <div class="detail-media"><span class="detail-emoji"></span></div>
        <div class="detail-info">
            <span class="detail-category"></span>
            <h1 class="detail-title"></h1>
            <p class="detail-price"></p>
            <p class="detail-stock"></p>
            <p class="detail-desc"></p>
            <form class="add-form">
                <label for="qty">Quantity</label>
                <div class="qty">
                    <button type="button" class="qty-btn" data-step="-1" aria-label="Decrease quantity">−</button>
                    <input id="qty" type="number" min="1" value="1">
                    <button type="button" class="qty-btn" data-step="1" aria-label="Increase quantity">+</button>
                </div>
                <button type="submit" class="btn-primary">Add to cart</button>
            </form>
            <p class="added-msg" hidden>Added to your cart. <a href="cart.html">View cart →</a></p>
        </div>
    </div>
</template>
</body>
</html>
