<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>My orders - Kim Shop</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/my-orders.js"></script>
    </head>

    <body>
        <header class="site-header">
            <div class="container header-inner">
                <a href="index.html" class="brand">
                    <span class="brand-mark">KS</span>
                    <span class="brand-text">Kim Shop</span>
                </a>
                <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                <path d="M3 6h18"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span id="cart-count" class="cart-badge" hidden>0</span>
        </a>
            </div>
        </header>

        <main class="container">
            <a href="index.html" class="back-link">← Continue shopping</a>
            <h1 class="page-title">My orders</h1>

            <div id="orders-message">
                <p class="hint">Loading your orders..</p>
            </div>

            <div id="orders-list" class="orders-list"></div>
        </main>

        <footer class="site-footer">
            <div class="container">Kim Shop · A practice project with Spring Boot and plain JavaScript</div>
        </footer>

        <template id="order-card">
            <a class="order-card">
                <div class="order-card-main">
                    <span class="order-card-ref"></span>
                    <span class="order-card-date"></span>
                </div>
                <div card="order-card-side">
                    <span class="order-card-status status-pill"></span>
                    <span class="order-card-items"></span>
                    <strong class="order-card-total"></strong>
                </div>
            </a>
        </template>
    </body>
</html>
