spring.application.name=shop

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/shop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.data.web.pageable.max-page-size=50

shop.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

shop.jwt.secret=${JWT_SECRET}
shop.jwt.expiration=1h

shop.admin.email=${ADMIN_EMAIL:}
shop.admin.password=${ADMIN_PASSWORD:}
shop.admin.name=${ADMIN_NAME:Admin}